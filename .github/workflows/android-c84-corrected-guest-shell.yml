name: C84 corrected actual guest shell and original Android continuation
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-c84-corrected-guest-shell.yml
    - state/experiments/c84-plan.json
    - state/experiments/c84-artifacts.json
    - state/experiments/c84-input-*.txt
    - scripts/run-c84-stage.py
    - scripts/prepare-c84-corrective-state.py
    - scripts/console_command_syntax.py
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-c84-corrected-guest-shell
  cancel-in-progress: false
jobs:
  c84-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Authenticate latest clean92B, exact prior failure and corrected actual shell arguments
      run: "python3 scripts/verify-reverseandroid-import.py\nnode --test tests/reverseandroid_console_proof.test.mjs\
        \ tests/reverseandroid_epoch_input.test.mjs tests/reverseandroid_campaign_input.test.mjs\npython3\
        \ tests/console_command_syntax_test.py\npython3 tests/c84_corrective_state_test.py\npython3 tests/control_console_phase_test.py\n\
        python3 tests/reverseandroid_workflow_phase_guard_test.py\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ native-cache build/reverseandroid state/experiments/c84-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ clz-native build/clz-native state/experiments/c84-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ clz-hardware build/clz-hardware state/experiments/c84-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ peripheral-peer build/peripheral-peer state/experiments/c84-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ campaign-console build/campaign-console state/experiments/c84-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ seed build/source-c84 state/experiments/c84-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ media-manifest build/media-input state/experiments/c84-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ media-aa build/media-input state/experiments/c84-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ media-ab build/media-input state/experiments/c84-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ media-ac build/media-input state/experiments/c84-artifacts.json\npython3 scripts/restore-reverseandroid-media.py\
        \ build/media-input build/media/android-c27.raw\nchmod +x build/clz-native/epoch-clz build/reverseandroid/frame\n\
        mkdir -p evidence/c84-reports\npython3 scripts/prepare-peripheral-privatepts-buffered-inputs.py\
        \ build/peripheral-peer build/c84-regenerated-proposal\npython3 - <<'PYVALIDATE'\nimport pathlib,json,hashlib,sys\n\
        sys.path.insert(0,'scripts')\nfrom console_command_syntax import extract_su_shell_body,validate_nested_console_command\n\
        read=lambda p:json.loads(pathlib.Path(p).read_text())\nh=lambda p:hashlib.file_digest(pathlib.Path(p).open('rb'),'sha256').hexdigest()\n\
        p=read('state/experiments/c84-plan.json')\nassert h('build/clz-native/epoch-clz')==p['expected_extended_native_SHA256']\n\
        assert h('build/reverseandroid/epoch')==p['original_native_SHA256']\nfor directory,hardware in\
        \ [('build/clz-native',0),('build/clz-hardware',30887)]:\n d=pathlib.Path(directory);assert (d/'execution-commit.txt').read_text().strip()==p['validated_CLZ_commit']\n\
        \ t=read(d/'clz-test.json');assert t['CLZ_cases']==30887 and t['real_AArch64_hardware_cases']==hardware\n\
        \ assert all(t[k] for k in ['mathematical_oracle','all_six_forms','all_register_pairs','exhaustive_B_H_values','FP_traps_and_reserved_rejection'])\n\
        \ assert read(d/'baseline-refusal.json')['original_exact_opcode_rejected_without_state_change']\n\
        \ m=read(d/'extension-manifest.json');assert m['extension_SHA256']==p['extension_SHA256']\n assert\
        \ m['all_870_imported_files_unchanged'] and m['snapshot_codecs_RAM_disk_clock_seed_and_cadence_unchanged']\n\
        \ assert not m['original_engine_binary_unchanged_claimed']\nassert h('extensions/aarch64-clz.inc')==p['extension_SHA256']\n\
        for phase,index in zip(p['phases'][4:],[3,4]):\n f=pathlib.Path(phase['input_file']);assert f.stat().st_size==phase['input_bytes']<=4096\
        \ and h(f)==phase['input_sha256']\n validate_nested_console_command(f.read_bytes())\n assert extract_su_shell_body(f.read_bytes())==extract_su_shell_body(pathlib.Path(f'build/c84-regenerated-proposal/input-{index}.txt').read_bytes())\n\
        PYVALIDATE\nnode --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs preflight\
        \ build/source-c84 > evidence/c84-reports/source-admission.json\npython3 scripts/prepare-c84-corrective-state.py\
        \ build/source-c84 build/campaign-console/evidence/c83-reports/console-all.bin evidence/c84-reports\
        \ state/experiments/c84-plan.json\n"
    - name: 'Private PTS stage 1: one bounded admitted CLZ-extension run and at most one authenticated
        buffered input'
      id: r1
      if: success()
      run: 'python3 scripts/run-c84-stage.py 1

        '
    - name: 'Private PTS stage 1: inspect original executables and actual reciprocal kernel PTY links'
      if: success() && steps.r1.outcome == 'success'
      continue-on-error: true
      run: 'TASK_ABI2_SHA=$(python3 -c ''import json;print(json.load(open("evidence/c84-1/output-contract.json"))["checkpoint_sha256"])'')

        node --max-old-space-size=5000 tools/reverseandroid-peripheral-probe.mjs evidence/c84-1/current.rvg
        "$TASK_ABI2_SHA" evidence/c84-1/peripherals-readonly.json /data/local/tmp/reverseandroid-peer-abi3.elf

        '
    - name: 'Private PTS stage 1: preserve every complete original checkpoint piece'
      if: always() && (steps.r1.outcome == 'success' || steps.r1.outcome == 'failure') && hashFiles('evidence/c84-1/c46-progress.json')
        != ''
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/c84-1
        transport_path: build/c84-transport-1
        artifact_prefix: reverseandroid-c84-1
    - name: 'Private PTS stage 1: release only earlier host duplicates after complete preservation'
      if: success() && steps.r1.outcome == 'success'
      run: 'rm -rf build/source-c84

        '
    - name: 'Private PTS stage 2: one bounded admitted CLZ-extension run and at most one authenticated
