name: C91D2 latest preserved scheduler and Binder diagnosis
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/android-c91d2-scheduler-binder.yml
      - scripts/select_latest_preserved_c91.py
      - tests/select_latest_preserved_c91_test.py
      - extensions/host-thread-probe/reverseandroid-thread-probe-4g.mjs
      - tests/host_thread_probe_4g_test.py
      - scripts/c91d2_scheduler_binder_analysis.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: reverseandroid-c91d2-readonly-latest
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify derived read-only diagnostics
        run: |
          mkdir -p evidence/c91d2
          python3 -m unittest tests/select_latest_preserved_c91_test.py tests/host_thread_probe_4g_test.py
          python3 scripts/verify-reverseandroid-import.py
          node --test tests/host_memory_lines.test.mjs
      - name: Build the validated large-snapshot observer profile
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          python3 scripts/prepare-host-transport.py build/host-transport-runtime
          python3 scripts/fetch-reverseandroid-artifact.py host-native build/host-native state/experiments/c91-stage-1-artifacts.json
          python3 scripts/fetch-reverseandroid-artifact.py host-validation build/host-validation state/experiments/c91-stage-1-artifacts.json
          python3 scripts/prepare-host-observer.py build/host-observer-runtime
          cp extensions/host-thread-probe/reverseandroid-thread-probe-4g.mjs build/host-observer-runtime/tools/reverseandroid-thread-probe-4g.mjs
      - name: Select and recover the highest fully preserved C91 source
        id: source
        run: |
          python3 scripts/select_latest_preserved_c91.py > evidence/c91d2/source-selection.json
          python3 scripts/fetch-reverseandroid-artifact.py seed build/source-c91d2 state/experiments/runtime-c91-selection/c91-selected-artifacts.json
          SHA=$(python3 -c 'import json;print(json.load(open("evidence/c91d2/source-selection.json"))["checkpoint_sha256"])')
          node --expose-gc --max-old-space-size=5000 build/host-observer-runtime/tools/reverseandroid-epoch.mjs preflight build/source-c91d2 > evidence/c91d2/source-preflight.json
          test "$(sha256sum build/source-c91d2/current.rvg | cut -d' ' -f1)" = "$SHA"
      - name: Read Binder queues scheduler state and all thread priorities
        run: |
          SHA=$(python3 -c 'import json;print(json.load(open("evidence/c91d2/source-selection.json"))["checkpoint_sha256"])')
          node --max-old-space-size=5000 build/host-observer-runtime/tools/reverseandroid-host-kernel-observer.mjs             build/source-c91d2/current.rvg "$SHA" 4026531840             --live-properties --binder-probe --scheduler-probe --zygote-probe             > evidence/c91d2/deep-kernel.json
          node --max-old-space-size=5000 build/host-observer-runtime/tools/reverseandroid-thread-probe-4g.mjs             build/source-c91d2/current.rvg "$SHA" evidence/c91d2/thread-scheduling.json             --all-scheduling --diagnostic-processes --copy-processes
          python3 scripts/c91d2_scheduler_binder_analysis.py             build/source-c91d2 evidence/c91d2/source-selection.json evidence/c91d2/deep-kernel.json             evidence/c91d2/thread-scheduling.json evidence/c91d2/summary.json
          sha256sum evidence/c91d2/*.json > evidence/c91d2/SHA256SUMS
      - name: Upload C91D2 read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reverseandroid-c91d2-scheduler-binder
          path: evidence/c91d2
          retention-days: 90
          if-no-files-found: error
      - name: Publish compact C91D2 summary
        if: success()
        run: |
          mkdir -p docs/evidence/c91
          cp evidence/c91d2/summary.json docs/evidence/c91/c91d2-latest-scheduler-binder-summary.json
          git config user.name reverseAndroid-ci
          git config user.email reverseandroid-ci@users.noreply.github.com
          git add docs/evidence/c91/c91d2-latest-scheduler-binder-summary.json
          git commit -m "Record C91D2 latest preserved scheduler Binder diagnosis" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
