name: C88 guarded JIT5922 priority and original Android boot continuation
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-c88-jit-priority.yml
    - state/experiments/c88-plan.json
    - state/experiments/c88-artifacts.json
    - state/experiments/c88-input-jit5922.txt
    - state/experiments/c88-source-console.gz.b64
    - scripts/c88_jit_priority_control.py
    - scripts/prepare-c88-resume-state.py
    - scripts/run-c88-stage.py
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-c88-jit-priority
  cancel-in-progress: false
jobs:
  c88-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Admit selected C87 stage14, unchanged native, entire original console and all seven prior input events
      run: |
        mkdir -p build evidence/c88-reports
        python3 scripts/verify-reverseandroid-import.py
        python3 tests/c88_jit_priority_control_test.py
        python3 tests/c85_peripheral_completion_test.py
        python3 tests/control_console_phase_test.py
        python3 tests/reverseandroid_workflow_phase_guard_test.py
        node --test tests/reverseandroid_console_proof.test.mjs tests/reverseandroid_epoch_input.test.mjs tests/reverseandroid_campaign_input.test.mjs
        python3 scripts/fetch-reverseandroid-artifact.py native-cache build/reverseandroid state/experiments/c88-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py ic-native build/ic-native state/experiments/c88-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py ic-hardware build/ic-hardware state/experiments/c88-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py seed build/source-c88 state/experiments/c88-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/c88-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/c88-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/c88-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/c88-artifacts.json
        python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw
        chmod +x build/ic-native/epoch-clz-ic build/reverseandroid/frame
        node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs preflight build/source-c88 > evidence/c88-reports/source-original-admission.json
        python3 scripts/prepare-c88-resume-state.py build/source-c88 evidence/c88-reports
    - name: 'C88 bounded continuation stage 1: apply the authenticated guarded input once'
      id: r1
      if: success()
      run: |
        python3 scripts/run-c88-stage.py 1
    - name: 'C88 bounded continuation stage 1: preserve the complete original-admitted checkpoint'
      id: p1
      if: always() && (steps.r1.outcome == 'success' || steps.r1.outcome == 'failure') && hashFiles('evidence/c88-1/c46-progress.json')
        != ''
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/c88-1
        transport_path: build/c88-transport-1
        artifact_prefix: reverseandroid-c88-1
    - name: 'C88 bounded continuation stage 1: release only earlier host duplicates after complete preservation'
      if: success() && steps.r1.outcome == 'success' && steps.p1.outcome == 'success'
      run: |
        rm -rf build/source-c88
    - name: 'C88 bounded continuation stage 2: zero new UART input'
      id: r2
      if: success() && steps.r1.outcome == 'success' && steps.p1.outcome == 'success' && steps.r1.outputs.complete != 'true'
      run: |
        python3 scripts/run-c88-stage.py 2
    - name: 'C88 bounded continuation stage 2: preserve the complete original-admitted checkpoint'
      id: p2
      if: always() && (steps.r2.outcome == 'success' || steps.r2.outcome == 'failure') && hashFiles('evidence/c88-2/c46-progress.json')
