        assert read(d/'host-policy.json')['native_binary_sha256']==p['expected_native_SHA256']
        print(json.dumps({'original_BOOT_completed':True,'original_SystemServer_live':True,'SELinux_enforcing':True,'real_UI_and_response_still_require_actual_test':True}))
        PYFINAL
