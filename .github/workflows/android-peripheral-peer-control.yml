    - name: Require actual guest ELF hash, original HAL executables, three real PTY pairs and Binder registrations
      run: 'python3 - <<''PYFINAL''

        import json,pathlib

        s=json.loads(pathlib.Path(''evidence/peripheral-peer-control-reports/control-state.json'').read_text())

        assert s[''complete''] and not s[''failed''], ''The actual guest command has not completed successfully''

        assert len(s[''events''])==4 and len({x[''phase''] for x in s[''events'']})==4

        assert s[''actual_guest_ELF_hash_line_seen''] and s[''actual_AArch64_peer_ready_line_seen'']

        p=pathlib.Path(s[''source'']);g=json.loads((p/''c46-progress.json'').read_text());k=json.loads((p/''kernel-observation.json'').read_text());o=json.loads((p/''peripherals-readonly.json'').read_text())

        assert g[''source_boundary_verified''] and k[''live_kernel_security''][''selinux_enforcing'']

        assert o[''checkpoint_sha256'']==g[''checkpoint_sha256''] and o[''input_unchanged'']

        assert o[''real_AArch64_peer_alive''] and o[''original_oemlock_executable_alive''] and o[''original_sensors_executable_alive'']

        assert o[''OEM_channel_connected_to_actual_peer''] and o[''two_separate_sensor_channels_connected_to_actual_peer'']

        assert all(s[''original_HAL_registration_seen_in_actual_console''].values()), ''Require actual original
        Binder registrations''

        print(json.dumps({''original_HALs_connected'':True,''original_HALs_registered'':True,''boot_or_UI_completion_claimed'':False,''primary_modified'':False}))

        PYFINAL

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reverseandroid-peripheral-peer-control-evidence
        path: 'evidence/peripheral-peer-control-reports

          evidence/peripheral-peer-control-*/*.json

          evidence/peripheral-peer-control-*/*.log

          evidence/peripheral-peer-control-*/*.txt

          state/experiments/peripheral-peer-control-plan.json

          state/experiments/peripheral-peer-control-input-*.txt

          '
        retention-days: 90
        if-no-files-found: error
