name: Actual Android original HAL integration with authenticated PTY peripheral peer
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-peripheral-peer-control.yml
    - state/experiments/peripheral-peer-control-plan.json
    - state/experiments/peripheral-peer-control-artifacts.json
    - state/experiments/peripheral-peer-control-input-*.txt
    - scripts/run-peripheral-peer-control-stage.py
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-peripheral-peer-isolated-control
  cancel-in-progress: false
jobs:
  peripheral-peer-control:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Authenticate original source, exact native, immutable media and verified AArch64 peer
      run: "python3 scripts/verify-reverseandroid-import.py\npython3 scripts/fetch-reverseandroid-artifact.py native-cache\
        \ build/reverseandroid state/experiments/peripheral-peer-control-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ seed build/source-peripheral state/experiments/peripheral-peer-control-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ peripheral-peer build/peripheral-peer state/experiments/peripheral-peer-control-artifacts.json\npython3\
        \ scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/peripheral-peer-control-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/peripheral-peer-control-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/peripheral-peer-control-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/peripheral-peer-control-artifacts.json\n\
        python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw\nchmod +x\
        \ build/reverseandroid/epoch build/reverseandroid/frame\nmkdir -p evidence/peripheral-peer-control-reports\n\
        python3 - <<'PYAUDIT'\nimport pathlib,json,hashlib,gzip\np=pathlib.Path('build/reverseandroid');h=lambda\
        \ f:hashlib.file_digest(f.open('rb'),'sha256').hexdigest()\nassert h(p/'epoch')=='72f53074817c140d79b0f91b20c72900efb5072f6c0b08d00ca58bf6c50ca1fa'\n\
        f=json.loads((p/'console-event-test.json').read_text());assert len(f)==5 and all(v is True for v in f.values())\n\
        p=pathlib.Path('build/peripheral-peer');m=json.loads((p/'build-manifest.json').read_text());e=json.loads(pathlib.Path('state/experiments/peripheral-peer-control-plan.json').read_text())\n\
        assert (p/'execution-commit.txt').read_text().strip()=='e11a4b86cdb9f79f8d553f67a09bf74afddd9cbe'\nassert\
        \ h(p/'cuttlefish-peripheral-peer-aarch64')==m['ELF_SHA256']==e['ELF_SHA256']\nassert h(p/'peer-aarch64.gz')==m['gzip_SHA256']==e['gzip_SHA256']\n\
        assert gzip.decompress((p/'peer-aarch64.gz').read_bytes())==(p/'cuttlefish-peripheral-peer-aarch64').read_bytes()\n\
        assert all(json.loads((p/'protocol-test.json').read_text()).values())\nt=json.loads((p/'pty-test.json').read_text());assert\
        \ not t.pop('host_device_provisioning_attempted') and not t.pop('Android_HAL_integration_claimed');assert\
        \ all(t.values())\nfor phase in e['phases']:\n f=pathlib.Path(phase['input_file']);assert f.stat().st_size==phase['input_bytes']<=4096\
        \ and h(f)==phase['input_sha256']\nPYAUDIT\nnode --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs\
        \ preflight build/source-peripheral > evidence/peripheral-peer-control-reports/source-admission.json\n"
    - name: 'Control stage 1: deliver at most one authenticated fragment and fully admit original execution'
      id: r1
      if: success()
      run: 'python3 scripts/run-peripheral-peer-control-stage.py 1

        '
    - name: 'Control stage 1: inspect original HALs and actual kernel PTY backlinks without mutations'
      if: success() && steps.r1.outcome == 'success'
      continue-on-error: true
      run: 'TASK_PEER_SHA=$(python3 -c ''import json;print(json.load(open("evidence/peripheral-peer-control-1/output-contract.json"))["checkpoint_sha256"])'')

        node --max-old-space-size=5000 tools/reverseandroid-peripheral-probe.mjs evidence/peripheral-peer-control-1/current.rvg
        "$TASK_PEER_SHA" evidence/peripheral-peer-control-1/peripherals-readonly.json

        '
    - name: 'Control stage 1: preserve every full original checkpoint piece'
      if: always() && (steps.r1.outcome == 'success' || steps.r1.outcome == 'failure')
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/peripheral-peer-control-1
        transport_path: build/peripheral-peer-control-transport-1
        artifact_prefix: reverseandroid-peripheral-peer-control-1
    - name: 'Control stage 1: release only earlier host duplicates after all pieces are preserved'
      if: success() && steps.r1.outcome == 'success'
      run: 'rm -rf build/source-peripheral

        '
    - name: 'Control stage 2: deliver at most one authenticated fragment and fully admit original execution'
      id: r2
      if: success() && steps.r1.outcome == 'success' && steps.r1.outputs.complete != 'true'
      run: 'python3 scripts/run-peripheral-peer-control-stage.py 2

        '
