name: Android C77 continued corrected boot epoch
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-c77-continued-epoch.yml
    - state/experiments/c77-plan.json
    - state/experiments/c77-artifacts.json
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-c77-campaign
  cancel-in-progress: false
jobs:
  c77-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Build and validate the unchanged engine and explicit epoch runner
      run: 'bash scripts/build-reverseandroid.sh

        bash scripts/build-reverseandroid-epoch.sh

        mkdir -p evidence/c77-reports

        '
    - name: Preserve the tested original epoch runner and decoder for future continuations
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: reverseandroid-c77-tested-epoch-native
        path: 'build/reverseandroid/epoch

          build/reverseandroid/frame

          build/reverseandroid/power-cycle

          build/reverseandroid/*.json

          build/reverseandroid/*.tap

          build/reverseandroid/*sha256*.txt'
        retention-days: 90
        if-no-files-found: error
    - name: Recover the complete admitted C76 final boundary without resetting the guest
      run: 'python3 scripts/fetch-reverseandroid-artifact.py seed build/source state/experiments/c77-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/c77-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/c77-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/c77-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/c77-artifacts.json

        python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw > evidence/c77-reports/disk.json

        node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs preflight build/source > evidence/c77-reports/source-admission.json

        '
    - name: 'C77 stage 1: continue and fully admit the same boot epoch'
      id: s1
      if: success()
      run: 'node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs run build/source evidence/c77-1
        build/reverseandroid/epoch build/media/android-c27.raw build/reverseandroid/frame "$(git rev-parse HEAD)" 1000000000
        > evidence/c77-reports/stage-1.json

        cp evidence/c77-1/kernel-observation.json evidence/c77-reports/kernel-1.json

        cp evidence/c77-1/console-new.txt evidence/c77-reports/console-1.txt

        python3 - <<''PYVERIFY''

        import pathlib,json,hashlib,shutil

        p=pathlib.Path(''evidence/c77-1'');g=json.load(open(p/''c46-progress.json''));assert g[''source_boundary_verified''];assert
        hashlib.file_digest(open(p/''current.rvg'',''rb''),''sha256'').hexdigest()==g[''checkpoint_sha256''];shutil.rmtree(p/''native/journal'')

        PYVERIFY

        '
    - name: 'C77 stage 1: preserve every complete original checkpoint piece'
      if: success() && steps.s1.outcome == 'success'
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/c77-1
        transport_path: build/c77-transport-1
        artifact_prefix: reverseandroid-c77-stage-1
    - name: Require the first complete continued snapshot to match the independent local execution
      if: success() && steps.s1.outcome == 'success'
      run: 'python3 - <<''PYCOMPARE''

        import json

        plan=json.load(open(''state/experiments/c77-plan.json''));actual=json.load(open(''evidence/c77-1/c46-progress.json''))

        assert actual[''source_boundary_verified'']

        assert actual[''instructions'']==plan[''expected_first_instructions'']

        assert actual[''checkpoint_sha256'']==plan[''expected_first_full_checkpoint_sha256''],''Complete original snapshot
        did not match local execution; uploaded state remains preserved for diagnosis''

        PYCOMPARE

        '
    - name: Release recovered input host copy after the first complete continued state was preserved
      if: success() && steps.s1.outcome == 'success'
      run: 'rm -rf build/source

        '
    - name: 'C77 stage 2: continue and fully admit the same boot epoch'
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.ready != 'true'
      run: 'node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs run evidence/c77-1 evidence/c77-2
        build/reverseandroid/epoch build/media/android-c27.raw build/reverseandroid/frame "$(git rev-parse HEAD)" 1000000000
        > evidence/c77-reports/stage-2.json

        cp evidence/c77-2/kernel-observation.json evidence/c77-reports/kernel-2.json

        cp evidence/c77-2/console-new.txt evidence/c77-reports/console-2.txt

        python3 - <<''PYVERIFY''

        import pathlib,json,hashlib,shutil

        p=pathlib.Path(''evidence/c77-2'');g=json.load(open(p/''c46-progress.json''));assert g[''source_boundary_verified''];assert
        hashlib.file_digest(open(p/''current.rvg'',''rb''),''sha256'').hexdigest()==g[''checkpoint_sha256''];shutil.rmtree(p/''native/journal'')

        PYVERIFY

        '
    - name: 'C77 stage 2: preserve every complete original checkpoint piece'
      if: success() && steps.s2.outcome == 'success'
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/c77-2
        transport_path: build/c77-transport-2
        artifact_prefix: reverseandroid-c77-stage-2
    - name: Release only previous host copies after all current transport pieces were preserved
      if: success() && steps.s2.outcome == 'success'
      run: 'rm -rf evidence/c77-1 build/c77-transport-1

        '
    - name: 'C77 stage 3: continue and fully admit the same boot epoch'
      id: s3
      if: success() && steps.s2.outcome == 'success' && steps.s2.outputs.ready != 'true'
      run: 'node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs run evidence/c77-2 evidence/c77-3
        build/reverseandroid/epoch build/media/android-c27.raw build/reverseandroid/frame "$(git rev-parse HEAD)" 1000000000
        > evidence/c77-reports/stage-3.json

        cp evidence/c77-3/kernel-observation.json evidence/c77-reports/kernel-3.json

        cp evidence/c77-3/console-new.txt evidence/c77-reports/console-3.txt

        python3 - <<''PYVERIFY''

