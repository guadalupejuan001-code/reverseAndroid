name: C91 resume C90R stage 5 with bounded host memory reader
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/android-c91-host-observer.yml
      - scripts/host_observer_continuation.py
      - scripts/prepare-host-observer.py
      - extensions/host-memory-lines/**
      - tests/host_observer_continuation_test.py
      - tests/host_memory_lines.test.mjs
      - state/experiments/c91-plan.json
      - state/experiments/c91-artifacts.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-c91-host-observer-continuation
  cancel-in-progress: false
jobs:
  c91-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify the original import and bounded reader regressions
        run: |
          mkdir -p build evidence/c91-reports
          cat /proc/meminfo > evidence/c91-reports/host-meminfo.txt
          df -h > evidence/c91-reports/host-disk.txt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          python3 scripts/verify-reverseandroid-import.py
          node --test tests/host_memory_lines.test.mjs
          python3 tests/host_observer_continuation_test.py
          python3 tests/host_transport_continuation_test.py
          python3 tests/c85_peripheral_completion_test.py
          python3 scripts/prepare-host-transport.py build/host-transport-runtime
      - name: Authenticate unchanged binaries and select the one-file derived observer profile
        run: |
          python3 scripts/fetch-reverseandroid-artifact.py native-cache build/reverseandroid state/experiments/c91-artifacts.json
          python3 scripts/fetch-reverseandroid-artifact.py ic-native build/ic-native state/experiments/c91-artifacts.json
          python3 scripts/fetch-reverseandroid-artifact.py host-native build/host-native state/experiments/c91-artifacts.json
          python3 scripts/fetch-reverseandroid-artifact.py host-validation build/host-validation state/experiments/c91-artifacts.json
          chmod +x build/ic-native/epoch-clz-ic build/reverseandroid/frame build/host-native/epoch-clz-ic-host build/host-native/frame
          python3 scripts/prepare-host-observer.py build/host-observer-runtime
          python3 scripts/host_observer_continuation.py profile
      - name: Recover admitted C90R stage 5 and reproduce complete original observations
        run: |
          python3 scripts/fetch-reverseandroid-artifact.py seed build/source-c91 state/experiments/c91-artifacts.json
          for name in media-manifest media-aa media-ab media-ac; do
            python3 scripts/fetch-reverseandroid-artifact.py "$name" build/media-input state/experiments/c91-artifacts.json
          done
          python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw
          node --expose-gc --max-old-space-size=5000 build/host-transport-runtime/tools/reverseandroid-epoch.mjs preflight build/source-c91 > evidence/c91-reports/source-baseline-admission.json
          node --expose-gc --max-old-space-size=5000 build/host-observer-runtime/tools/reverseandroid-epoch.mjs preflight build/source-c91 > evidence/c91-reports/source-observer-admission.json
          node --max-old-space-size=5000 build/host-observer-runtime/tools/reverseandroid-host-kernel-observer.mjs build/source-c91/current.rvg 7c00c86bb9af645fe7a6f416f63c0145351234ec20d749c2bf5b3dd30f5dd802 4026531840 --live-properties --zygote-probe > evidence/c91-reports/source-observer-kernel.json
          node --max-old-space-size=5000 build/host-observer-runtime/tools/reverseandroid-peripheral-probe.mjs build/source-c91/current.rvg 7c00c86bb9af645fe7a6f416f63c0145351234ec20d749c2bf5b3dd30f5dd802 evidence/c91-reports/source-observer-peripherals.json /data/local/tmp/reverseandroid-peer-abi3.elf > evidence/c91-reports/source-observer-peripherals.log
          python3 scripts/host_observer_continuation.py prepare
      - name: 'C91 stage 1: reproduce the failed-tail RVG hash with fresh complete admission'
        id: r1
        if: success()
        run: python3 scripts/host_observer_continuation.py run --stage 1
      - name: 'C91 stage 1: preserve every admitted checkpoint piece before advancing'
        id: p1
        if: always() && steps.r1.outcome == 'success'
        uses: ./.github/actions/preserve-android-checkpoint
        with:
          checkpoint_path: evidence/c91-1
          transport_path: build/c91-transport-1
          artifact_prefix: reverseandroid-c91-1
      - name: 'C91 stage 1: release only the previously preserved host duplicate'
        if: success() && steps.r1.outcome == 'success' && steps.p1.outcome == 'success'
        run: rm -rf build/source-c91 build/reverseandroid-seed-pieces
      - name: 'C91 stage 2: zero new UART and full original admission'
        id: r2
        if: success() && steps.r1.outcome == 'success' && steps.p1.outcome == 'success' && steps.r1.outputs.complete != 'true'
        run: python3 scripts/host_observer_continuation.py run --stage 2
      - name: 'C91 stage 2: preserve every admitted checkpoint piece before advancing'
        id: p2
        if: always() && steps.r2.outcome == 'success'
        uses: ./.github/actions/preserve-android-checkpoint
        with:
          checkpoint_path: evidence/c91-2
          transport_path: build/c91-transport-2
          artifact_prefix: reverseandroid-c91-2
      - name: 'C91 stage 2: release only the previously preserved host duplicate'
        if: success() && steps.r2.outcome == 'success' && steps.p2.outcome == 'success'
        run: rm -rf evidence/c91-1 build/c91-transport-1
      - name: 'C91 stage 3: zero new UART and full original admission'
        id: r3
        if: success() && steps.r2.outcome == 'success' && steps.p2.outcome == 'success' && steps.r2.outputs.complete != 'true'
        run: python3 scripts/host_observer_continuation.py run --stage 3
