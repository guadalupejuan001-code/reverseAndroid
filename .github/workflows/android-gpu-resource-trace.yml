name: Original Android GPU resource lifetime trace and exact control

'on':
  push:
    branches: [fix/virtio-gpu-resource-trace]
    paths:
      - .github/workflows/android-gpu-resource-trace.yml
      - extensions/gpu-resource-trace.hpp
      - scripts/prepare-gpu-resource-trace.py
      - scripts/build-gpu-resource-trace.sh
      - scripts/run-gpu-resource-trace-comparison.py
      - scripts/verify-gpu-resource-fixture-trace.py
      - tests/reverseandroid_gpu_resource_trace_test.cpp
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: reverseandroid-isolated-gpu-resource-trace
  cancel-in-progress: false

jobs:
  original-gpu-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify the original engine and actual GPU lifecycle fixture
        run: |
          bash scripts/build-reverseandroid.sh
          bash scripts/build-gpu-resource-trace.sh
      - name: Recover the complete admitted C88 source without replaying its input
        run: |
          mkdir -p evidence build
          python3 scripts/fetch-reverseandroid-artifact.py seed build/gpu-trace-source state/experiments/c88-stage-1-artifacts.json
          python3 scripts/fetch-reverseandroid-artifact.py ic-native build/ic-native state/experiments/c88-stage-1-artifacts.json
          python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/c88-stage-1-artifacts.json
          python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/c88-stage-1-artifacts.json
          python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/c88-stage-1-artifacts.json
          python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/c88-stage-1-artifacts.json
          python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw
          chmod +x build/ic-native/epoch-clz-ic
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('build/gpu-trace-source')
          c=json.loads((root/'output-contract.json').read_text())
          assert c['instructions']==124147727998
          assert c['checkpoint_sha256']=='8867798e0c98f554c4b7af0bf521ff5a3f39eb44914f759301e0e6e534b0f7d1'
          with (root/'current.rvg').open('rb') as f:
              assert hashlib.file_digest(f,'sha256').hexdigest()==c['checkpoint_sha256']
          PY
      - name: Compare original and traced Android for fifty million instructions each
        run: |
          python3 scripts/run-gpu-resource-trace-comparison.py \
            --source build/gpu-trace-source \
            --artifact-lock state/experiments/c88-stage-1-artifacts.json \
            --output evidence/gpu-resource-trace \
            --commit "$GITHUB_SHA"
          python3 scripts/verify-reverseandroid-import.py
      - name: Preserve the complete isolated control checkpoint
        if: always() && hashFiles('evidence/gpu-resource-trace/control/c46-progress.json') != ''
        uses: ./.github/actions/preserve-android-checkpoint
        with:
          checkpoint_path: evidence/gpu-resource-trace/control
          transport_path: build/gpu-resource-control-transport
          artifact_prefix: reverseandroid-isolated-gpu-resource-control
      - name: Preserve a distinct admitted diagnostic checkpoint if comparison failed
        if: always() && hashFiles('evidence/gpu-resource-trace/trace/c46-progress.json') != '' && hashFiles('evidence/gpu-resource-trace/gpu-trace-comparison.json') == ''
        uses: ./.github/actions/preserve-android-checkpoint
        with:
          checkpoint_path: evidence/gpu-resource-trace/trace
          transport_path: build/gpu-resource-diagnostic-transport
          artifact_prefix: reverseandroid-isolated-gpu-resource-diagnostic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverseandroid-gpu-resource-trace-evidence
          path: |
            evidence/gpu-resource-trace/*.json
            evidence/gpu-resource-trace/*/*.json
            evidence/gpu-resource-trace/*/*.txt
            evidence/gpu-resource-trace/*/*.log
            evidence/gpu-resource-trace/*/*.ppm
            build/gpu-resource-trace-src/gpu-trace-manifest.json
            build/gpu-resource-trace-tests/*.json
            build/gpu-resource-trace-tests/*.log
          if-no-files-found: error
          retention-days: 90
