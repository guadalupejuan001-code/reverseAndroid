      if: always()
      run: 'python3 - <<''PYRESULT''

        import json,pathlib

        p=pathlib.Path(''evidence/topapp/reports/control-state.json'')

        assert p.exists(),''No newly admitted group-control boundary; see preserved diagnostics''

        s=json.loads(p.read_text())

        result={k:s[k] for k in [''checkpoint_sha256'',''instructions'',''boost_reply'',''restore_reply'',''actual_boosted_group_verified'',''actual_original_shares_restored'',''original_system_server_alive'',''original_boot_completed'',''live_peripherals_verified'',''usable_UI_response_verified'',''failed'',''complete'']}

