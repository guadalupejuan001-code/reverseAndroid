name: Isolated CPU group scheduling and original Android boot
'on':
  push:
    branches:
    - experiment/zygote-cfs-shares-20261106
    paths:
    - scripts/run-topapp-shares-control.py
    - state/experiments/topapp-shares*
    - .github/workflows/android-topapp-shares-control.yml
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-isolated-topapp-shares-control
  cancel-in-progress: false
jobs:
  group-shares:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Verify original import and the guarded priority regression checks
      run: 'python3 scripts/verify-reverseandroid-import.py

        python3 tests/jit5922_priority_control_test.py'
    - name: Verify original import and real-shell boost/restore guards
      run: 'python3 scripts/verify-reverseandroid-import.py

        python3 tests/jit5922_priority_control_test.py

        python3 tests/topapp_shares_shell_test.py'
    - name: Recover exact admitted JIT stage3, original native and immutable media
      id: s1
      if: success()
      run: python3 scripts/run-jit5922-control.py 1 --source build/topapp-source --output-root evidence/jit5922
        --commit "$GITHUB_SHA"
    - name: 'Top-app stage 1: original bounded execution and guarded reversible group scheduling'
      id: s1
      if: success()
      run: python3 scripts/run-topapp-shares-control.py 1 --runtime-root . --source build/topapp-source --output-root
        evidence/topapp --commit "$GITHUB_SHA"
    - name: 'Top-app stage 1: preserve every complete admitted checkpoint piece'
      id: p1
      if: always() && (steps.s1.outcome == 'success' || steps.s1.outcome == 'failure')
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/topapp/stage-1
        transport_path: build/topapp-transport-1
        artifact_prefix: reverseandroid-topapp-control-1
    - name: 'Top-app stage 1: release earlier host copies after complete preservation'
      if: success() && steps.s1.outcome == 'success' && steps.p1.outcome == 'success'
      run: rm -rf build/topapp-source
    - name: 'Top-app stage 2: original bounded execution and guarded reversible group scheduling'
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.stop != 'true' && steps.p1.outcome == 'success'
      run: python3 scripts/run-topapp-shares-control.py 2 --runtime-root . --source build/topapp-source --output-root
        evidence/topapp --commit "$GITHUB_SHA"
    - name: 'Top-app stage 2: preserve every complete admitted checkpoint piece'
      id: p2
      if: always() && (steps.s2.outcome == 'success' || steps.s2.outcome == 'failure')
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/topapp/stage-2
        transport_path: build/topapp-transport-2
        artifact_prefix: reverseandroid-topapp-control-2
    - name: 'Top-app stage 2: release earlier host copies after complete preservation'
      if: success() && steps.s2.outcome == 'success' && steps.p2.outcome == 'success'
      run: rm -rf evidence/topapp/stage-1 build/topapp-transport-1
    - name: 'Top-app stage 3: original bounded execution and guarded reversible group scheduling'
      id: s3
      if: success() && steps.s2.outcome == 'success' && steps.s2.outputs.stop != 'true' && steps.p2.outcome == 'success'
