name: C90 original Android zero-input bounded continuation
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-c90-zero-input-continuation.yml
    - state/experiments/c90-plan.json
    - state/experiments/c90-artifacts.json
    - state/experiments/c90-source-console.gz.b64
    - scripts/zero_input_continuation.py
    - scripts/prepare-zero-input-continuation-state.py
    - scripts/run-zero-input-continuation-stage.py
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-c90-bounded-continuation
  cancel-in-progress: false
jobs:
  c90-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Admit the selected complete original source, unchanged native and entire previous console/input history
      run: |
        mkdir -p build evidence/c90-reports
        python3 scripts/verify-reverseandroid-import.py
        python3 tests/zero_input_continuation_test.py
        python3 tests/c88_jit_priority_control_test.py
        python3 tests/c85_peripheral_completion_test.py
        python3 tests/reverseandroid_workflow_phase_guard_test.py
        node --test tests/reverseandroid_console_proof.test.mjs tests/reverseandroid_epoch_input.test.mjs tests/reverseandroid_campaign_input.test.mjs
        python3 scripts/fetch-reverseandroid-artifact.py native-cache build/reverseandroid state/experiments/c90-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py ic-native build/ic-native state/experiments/c90-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py ic-hardware build/ic-hardware state/experiments/c90-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py seed build/source-c90 state/experiments/c90-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/c90-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/c90-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/c90-artifacts.json
        python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/c90-artifacts.json
        python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw
        chmod +x build/ic-native/epoch-clz-ic build/reverseandroid/frame
        node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs preflight build/source-c90 > evidence/c90-reports/source-original-admission.json
        python3 scripts/prepare-zero-input-continuation-state.py state/experiments/c90-plan.json build/source-c90 evidence/c90-reports
    - name: 'C90 bounded continuation stage 1: zero new UART with original full admission'
      id: r1
      if: success()
      run: |
        python3 scripts/run-zero-input-continuation-stage.py state/experiments/c90-plan.json 1
    - name: 'C90 bounded continuation stage 1: preserve every complete original checkpoint piece'
      id: p1
      if: always() && (steps.r1.outcome == 'success' || steps.r1.outcome == 'failure') && hashFiles('evidence/c90-1/c46-progress.json')
        != ''
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/c90-1
        transport_path: build/c90-transport-1
        artifact_prefix: reverseandroid-c90-1
    - name: 'C90 bounded continuation stage 1: release only earlier host duplicates after complete preservation'
      if: success() && steps.r1.outcome == 'success' && steps.p1.outcome == 'success'
      run: |
        rm -rf build/source-c90
    - name: 'C90 bounded continuation stage 2: zero new UART with original full admission'
      id: r2
      if: success() && steps.r1.outcome == 'success' && steps.p1.outcome == 'success' && steps.r1.outputs.complete != 'true'
      run: |
        python3 scripts/run-zero-input-continuation-stage.py state/experiments/c90-plan.json 2
    - name: 'C90 bounded continuation stage 2: preserve every complete original checkpoint piece'
