name: Android C81 measured ART progress on latest preserved epoch
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-c81-measured-art.yml
    - state/experiments/c81-plan.json
    - state/experiments/c81-artifacts.json
    - state/experiments/c81-priority-input*
    - scripts/run-c81-stage.py
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-c81-campaign
  cancel-in-progress: false
jobs:
  c81-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Authenticate the unchanged sources and the fully tested original C78 epoch runner
      run: 'python3 scripts/verify-reverseandroid-import.py

        python3 scripts/fetch-reverseandroid-artifact.py native-cache build/reverseandroid state/experiments/c81-artifacts.json

        chmod +x build/reverseandroid/epoch build/reverseandroid/frame

        python3 - <<''PYCACHE''

        import pathlib,json,hashlib

        p=pathlib.Path(''build/reverseandroid'')

        assert hashlib.file_digest((p/''epoch'').open(''rb''),''sha256'').hexdigest()==''72f53074817c140d79b0f91b20c72900efb5072f6c0b08d00ca58bf6c50ca1fa''

        t=json.loads((p/''console-event-test.json'').read_text());assert len(t)==5 and all(x is True for x in t.values())

        PYCACHE

        node --test tests/reverseandroid_epoch_input.test.mjs > build/reverseandroid/c81-epoch-input-tests.tap

        mkdir -p evidence/c81-reports

        '
    - name: Recover the latest pinned complete C80 boundary without resetting the guest
      run: 'python3 scripts/fetch-reverseandroid-artifact.py seed build/source-c81 state/experiments/c81-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/c81-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/c81-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/c81-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/c81-artifacts.json

        python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw > evidence/c81-reports/disk.json

        node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs preflight build/source-c81 > evidence/c81-reports/source-admission.json

        '
    - name: 'C81 stage 1: continue with original gates and at most one measured guarded input'
      id: s1
      if: success()
      run: python3 scripts/run-c81-stage.py 1
    - name: 'C81 stage 1: preserve every complete admitted checkpoint piece'
      if: always() && (steps.s1.outcome == 'success' || steps.s1.outcome == 'failure')
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/c81-1
        transport_path: build/c81-transport-1
        artifact_prefix: reverseandroid-c81-stage-1
    - name: 'C81 stage 1: release only earlier host duplicates after all pieces preserved'
      if: success() && steps.s1.outcome == 'success'
      run: rm -rf build/source-c81
    - name: 'C81 stage 2: continue with original gates and at most one measured guarded input'
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.stop != 'true'
      run: python3 scripts/run-c81-stage.py 2
    - name: 'C81 stage 2: preserve every complete admitted checkpoint piece'
      if: always() && (steps.s2.outcome == 'success' || steps.s2.outcome == 'failure')
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/c81-2
        transport_path: build/c81-transport-2
        artifact_prefix: reverseandroid-c81-stage-2
    - name: 'C81 stage 2: release only earlier host duplicates after all pieces preserved'
      if: success() && steps.s2.outcome == 'success'
      run: rm -rf evidence/c81-1 build/c81-transport-1
    - name: 'C81 stage 3: continue with original gates and at most one measured guarded input'
