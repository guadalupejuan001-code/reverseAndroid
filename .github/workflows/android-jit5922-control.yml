name: Isolated guarded JIT5922 priority and original Android continuation
'on':
  push:
    branches:
    - experiment/jit5922-control-20261106
    paths:
    - scripts/run-jit5922-control.py
    - state/experiments/jit5922-control*
    - .github/workflows/android-jit5922-control.yml
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-isolated-jit5922-control
  cancel-in-progress: false
jobs:
  guarded-priority:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Verify original import and the guarded priority regression checks
      run: 'python3 scripts/verify-reverseandroid-import.py

        python3 tests/jit5922_priority_control_test.py'
    - name: Recover exact original source, native and immutable media
      run: 'mkdir -p build

        python3 scripts/fetch-reverseandroid-artifact.py seed build/jit5922-source state/experiments/jit5922-control-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py native-cache build/reverseandroid state/experiments/jit5922-control-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py ic-native build/ic-native state/experiments/jit5922-control-artifacts.json

        chmod +x build/reverseandroid/frame build/ic-native/epoch-clz-ic

        python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/jit5922-control-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/jit5922-control-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/jit5922-control-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/jit5922-control-artifacts.json

        python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw

        node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs preflight build/jit5922-source > build/jit5922-source-preflight.json'
    - name: 'JIT5922 stage 1: original bounded execution and one total guarded priority input'
      id: s1
      if: success()
      run: python3 scripts/run-jit5922-control.py 1 --source build/jit5922-source --output-root evidence/jit5922 --commit
        "$GITHUB_SHA"
    - name: 'JIT5922 stage 1: preserve every complete admitted checkpoint part'
      id: p1
      if: always() && (steps.s1.outcome == 'success' || steps.s1.outcome == 'failure')
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/jit5922/stage-1
        transport_path: build/jit5922-transport-1
        artifact_prefix: reverseandroid-jit5922-control-1
    - name: 'JIT5922 stage 1: release earlier host copies after complete preservation'
      if: success() && steps.s1.outcome == 'success' && steps.p1.outcome == 'success'
      run: rm -rf build/jit5922-source
    - name: 'JIT5922 stage 2: original bounded execution and one total guarded priority input'
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.stop != 'true' && steps.p1.outcome == 'success'
