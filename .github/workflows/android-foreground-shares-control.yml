name: Actual SystemServer foreground CPU-group control and original boot
'on':
  push:
    branches:
    - experiment/systemserver-foreground-20261106
    paths:
    - state/experiments/foreground-shares-artifacts.json
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-systemserver-foreground-control
  cancel-in-progress: false
jobs:
  foreground:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Verify original import and exact Foreground guards
      run: 'python3 scripts/verify-reverseandroid-import.py

        python3 tests/jit5922_priority_control_test.py

        python3 tests/topapp_shares_shell_test.py

        python3 tests/foreground_shares_shell_test.py'
    - name: Recover the authenticated Foreground source, original native and immutable media
      run: 'mkdir -p build

        python3 scripts/fetch-reverseandroid-artifact.py seed build/foreground-source state/experiments/foreground-shares-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py native-cache build/reverseandroid state/experiments/foreground-shares-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py ic-native build/ic-native state/experiments/foreground-shares-artifacts.json

        chmod +x build/reverseandroid/frame build/ic-native/epoch-clz-ic

        python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/foreground-shares-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/foreground-shares-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/foreground-shares-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/foreground-shares-artifacts.json

        python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw

        node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs preflight build/foreground-source
        > build/foreground-source-preflight.json'
    - name: 'Foreground stage 1: original bounded run and source-bound reversible shares'
      id: s1
      if: success()
      run: python3 scripts/run-foreground-shares-control.py 1 --runtime-root . --source build/foreground-source
        --output-root evidence/foreground --commit "$GITHUB_SHA"
    - name: 'Foreground stage 1: preserve all complete admitted checkpoint pieces'
      id: p1
      if: always() && (steps.s1.outcome == 'success' || steps.s1.outcome == 'failure')
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/foreground/stage-1
        transport_path: build/foreground-transport-1
        artifact_prefix: reverseandroid-foreground-control-1
    - name: 'Foreground stage 1: release prior runner copies after full preservation'
      if: success() && steps.s1.outcome == 'success' && steps.p1.outcome == 'success'
      run: rm -rf build/foreground-source
    - name: 'Foreground stage 2: original bounded run and source-bound reversible shares'
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.stop != 'true' && steps.p1.outcome == 'success'
      run: python3 scripts/run-foreground-shares-control.py 2 --runtime-root . --source build/foreground-source
        --output-root evidence/foreground --commit "$GITHUB_SHA"
    - name: 'Foreground stage 2: preserve all complete admitted checkpoint pieces'
