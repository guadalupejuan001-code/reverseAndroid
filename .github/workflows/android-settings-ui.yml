name: Original completed-boot Android Settings response
'on':
  push:
    branches:
    - experiment/android-settings-ui-20261106
    paths:
    - state/experiments/settings-ui-artifacts.json
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-settings-ui-validation
  cancel-in-progress: false
jobs:
  settings-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Verify original import and real-shell boost/restore guards
      run: 'python3 scripts/verify-reverseandroid-import.py

        python3 tests/jit5922_priority_control_test.py

        python3 tests/topapp_shares_shell_test.py'
    - name: Verify original import and Settings request/identity guards
      run: 'python3 scripts/verify-reverseandroid-import.py

        python3 tests/android_settings_ui_test.py

        node --test tests/android_settings_identity_test.mjs'
    - name: Recover original completed-boot state with restored normal shares
      run: python3 scripts/run-topapp-shares-control.py 1 --runtime-root . --source build/settings-ui-source --output-root
        evidence/topapp --commit "$GITHUB_SHA"
    - name: 'Settings stage 1: one source-bound UI request, then zero-input bounded continuation'
      id: s1
      if: success()
      run: python3 scripts/run-android-settings-ui.py 1 --runtime-root . --source build/settings-ui-source --output-root
        evidence/settings-ui --commit "$GITHUB_SHA"
    - name: 'Settings stage 1: preserve complete original admitted state'
      id: p1
      if: always() && (steps.s1.outcome == 'success' || steps.s1.outcome == 'failure')
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/settings-ui/stage-1
        transport_path: build/settings-ui-transport-1
        artifact_prefix: reverseandroid-settings-ui-1
    - name: 'Settings stage 1: release previous runner copies after full preservation'
      if: success() && steps.s1.outcome == 'success' && steps.p1.outcome == 'success'
      run: rm -rf build/settings-ui-source
    - name: 'Settings stage 2: one source-bound UI request, then zero-input bounded continuation'
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.stop != 'true' && steps.p1.outcome == 'success'
      run: python3 scripts/run-android-settings-ui.py 2 --runtime-root . --source build/settings-ui-source --output-root
        evidence/settings-ui --commit "$GITHUB_SHA"
    - name: 'Settings stage 2: preserve complete original admitted state'
      id: p2
      if: always() && (steps.s2.outcome == 'success' || steps.s2.outcome == 'failure')
      uses: ./.github/actions/preserve-android-checkpoint
