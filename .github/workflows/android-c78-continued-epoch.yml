      continue-on-error: true
      run: 'TASK_SOURCE_SHA=$(python3 -c ''import json;print(json.load(open("evidence/c78-4/output-contract.json"))["checkpoint_sha256"])'')

        node --max-old-space-size=5000 tools/reverseandroid-lights-probe.mjs evidence/c78-4/current.rvg "$TASK_SOURCE_SHA"
        evidence/c78-4/lights-readonly.json

        cp evidence/c78-4/lights-readonly.json evidence/c78-reports/lights-4.json

