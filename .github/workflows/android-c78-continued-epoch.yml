name: Android C78 continued corrected boot epoch
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-c78-continued-epoch.yml
    - state/experiments/c78-plan.json
    - state/experiments/c78-artifacts.json
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-c78-campaign
  cancel-in-progress: false
jobs:
  c78-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Build and validate the unchanged engine and explicit epoch runner
      run: 'bash scripts/build-reverseandroid.sh

        bash scripts/build-reverseandroid-epoch.sh

        mkdir -p evidence/c78-reports

        '
    - name: Preserve the tested original epoch runner and decoder for future continuations
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: reverseandroid-c78-tested-epoch-native
        path: 'build/reverseandroid/epoch

          build/reverseandroid/frame

          build/reverseandroid/power-cycle

          build/reverseandroid/*.json

          build/reverseandroid/*.tap

          build/reverseandroid/*sha256*.txt'
        retention-days: 90
        if-no-files-found: error
    - name: Recover the latest pinned complete C77 boundary without resetting the guest
      run: 'python3 scripts/fetch-reverseandroid-artifact.py seed build/source state/experiments/c78-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/c78-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/c78-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/c78-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/c78-artifacts.json

        python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw > evidence/c78-reports/disk.json

        node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs preflight build/source > evidence/c78-reports/source-admission.json

        '
    - name: 'C78 stage 1: continue and fully admit the same boot epoch'
      id: s1
      if: success()
      run: 'node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs run build/source evidence/c78-1
        build/reverseandroid/epoch build/media/android-c27.raw build/reverseandroid/frame "$(git rev-parse HEAD)"
        1000000000 > evidence/c78-reports/stage-1.json

        cp evidence/c78-1/kernel-observation.json evidence/c78-reports/kernel-1.json

        cp evidence/c78-1/console-new.txt evidence/c78-reports/console-1.txt

        python3 - <<''PYVERIFY''

        import pathlib,json,hashlib,shutil

        p=pathlib.Path(''evidence/c78-1'');g=json.load(open(p/''c46-progress.json''));assert g[''source_boundary_verified''];assert
        hashlib.file_digest(open(p/''current.rvg'',''rb''),''sha256'').hexdigest()==g[''checkpoint_sha256''];shutil.rmtree(p/''native/journal'')

        PYVERIFY

        '
    - name: 'C78 stage 1: preserve every complete original checkpoint piece'
      if: success() && steps.s1.outcome == 'success'
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/c78-1
        transport_path: build/c78-transport-1
        artifact_prefix: reverseandroid-c78-stage-1
    - name: Verify the exact source pin and compare the first complete snapshot when independently known
      if: success() && steps.s1.outcome == 'success'
      run: "python3 - <<'PYCOMPARE'\nimport json\nplan=json.load(open('state/experiments/c78-plan.json'))\nsource=json.load(open('evidence/c78-1/input-contract.json'))\n\
        actual=json.load(open('evidence/c78-1/c46-progress.json'))\nassert source['checkpoint_sha256']==plan['source_checkpoint_sha256']\n\
        assert source['instructions']==plan['source_instructions']\nassert actual['source_boundary_verified']\n\
        if 'expected_first_full_checkpoint_sha256' in plan:\n    assert actual['instructions']==plan['expected_first_instructions']\n\
        \    assert actual['checkpoint_sha256']==plan['expected_first_full_checkpoint_sha256']\nPYCOMPARE\n"
    - name: Release recovered input host copy after the first complete continued state was preserved
      if: success() && steps.s1.outcome == 'success'
      run: 'rm -rf build/source

        '
    - name: 'C78 stage 2: continue and fully admit the same boot epoch'
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.ready != 'true'
      run: 'node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs run evidence/c78-1 evidence/c78-2
        build/reverseandroid/epoch build/media/android-c27.raw build/reverseandroid/frame "$(git rev-parse HEAD)"
        1000000000 > evidence/c78-reports/stage-2.json

        cp evidence/c78-2/kernel-observation.json evidence/c78-reports/kernel-2.json

        cp evidence/c78-2/console-new.txt evidence/c78-reports/console-2.txt

        python3 - <<''PYVERIFY''

        import pathlib,json,hashlib,shutil

        p=pathlib.Path(''evidence/c78-2'');g=json.load(open(p/''c46-progress.json''));assert g[''source_boundary_verified''];assert
        hashlib.file_digest(open(p/''current.rvg'',''rb''),''sha256'').hexdigest()==g[''checkpoint_sha256''];shutil.rmtree(p/''native/journal'')

        PYVERIFY

        '
    - name: 'C78 stage 2: preserve every complete original checkpoint piece'
      if: success() && steps.s2.outcome == 'success'
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/c78-2
        transport_path: build/c78-transport-2
        artifact_prefix: reverseandroid-c78-stage-2
    - name: Release only previous host copies after all current transport pieces were preserved
      if: success() && steps.s2.outcome == 'success'
      run: 'rm -rf evidence/c78-1 build/c78-transport-1

        '
    - name: 'C78 stage 3: continue and fully admit the same boot epoch'
      id: s3
      if: success() && steps.s2.outcome == 'success' && steps.s2.outputs.ready != 'true'
      run: 'node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs run evidence/c78-2 evidence/c78-3
        build/reverseandroid/epoch build/media/android-c27.raw build/reverseandroid/frame "$(git rev-parse HEAD)"
        1000000000 > evidence/c78-reports/stage-3.json

        cp evidence/c78-3/kernel-observation.json evidence/c78-reports/kernel-3.json

