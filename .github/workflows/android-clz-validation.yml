name: Exact Android CLZ blocker and native AArch64 instruction validation
'on':
  push:
    branches: [main]
    paths:
      - extensions/aarch64-clz.inc
      - scripts/prepare-clz-extension.py
      - scripts/build-reverseandroid-clz.sh
      - tests/reverseandroid_clz_test.cpp
      - .github/workflows/android-clz-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - name: Reproduce exact original refusal and validate all six CLZ vector forms
        run: bash scripts/build-reverseandroid-clz.sh
      - name: Require actual hardware oracle on AArch64
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          python3 - <<'PY'
          import json,platform
          assert platform.machine() == 'aarch64'
          p=json.load(open('build/reverseandroid-clz/clz-test.json'))
          assert p['real_AArch64_hardware_cases'] == p['CLZ_cases'] == 30887
          PY
      - name: Bind build to execution commit
        if: success()
        run: echo "$GITHUB_SHA" > build/reverseandroid-clz/execution-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverseandroid-clz-${{ matrix.os }}
          path: |
            build/reverseandroid-clz/*.json
            build/reverseandroid-clz/*.txt
            build/reverseandroid-clz/*.sha256
            build/reverseandroid-clz/epoch-clz
          if-no-files-found: error
          retention-days: 90
