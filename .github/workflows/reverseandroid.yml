name: reverseAndroid verified migration and continuation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-engine-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      continue_on_push: ${{ steps.plan.outputs.continue_on_push }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24.22.1}
      - name: Read the explicit next-cycle policy
        id: plan
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('state/continuation.json'));
          if(p.execute_on_push!==undefined && typeof p.execute_on_push!=='boolean')throw Error('Invalid execute_on_push');
          appendFileSync(process.env.GITHUB_OUTPUT,'continue_on_push='+String(p.execute_on_push!==false)+'\n');
          NODE
      - name: Verify all 870 source files and the original engine and admission tests
        run: bash scripts/build-reverseandroid.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverseandroid-tested-native
          path: |
            build/reverseandroid/*.json
            build/reverseandroid/*.txt
            build/reverseandroid/*.tap
            build/reverseandroid/native
            build/reverseandroid/frame
          if-no-files-found: error
          retention-days: 90
  authenticated-android-continuation:
    needs: original-engine-validation
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.original-engine-validation.outputs.continue_on_push == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
      REVERSE_PC_C39_CHUNK: '1000000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24.22.1}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: reverseandroid-tested-native, path: build/native}
      - name: Fetch and authenticate the pinned original continuation source
        run: |
          python3 scripts/fetch-reverseandroid-artifact.py seed build/source-state
          chmod +x build/native/native build/native/frame
          mkdir -p evidence/migration
          node --max-old-space-size=5000 tools/reverseandroid-seed.mjs build/source-state evidence/migration/seed-admission.json
      - name: Preserve the source checkpoint in recoverable pieces
        run: python3 scripts/pack-reverseandroid-checkpoint.py build/source-state build/seed-transport > evidence/migration/seed-transport.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-source-checkpoint-000, path: build/seed-transport/checkpoint.part-000, compression-level: 0, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-source-checkpoint-001, path: build/seed-transport/checkpoint.part-001, compression-level: 0, retention-days: 90, if-no-files-found: warn}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-source-checkpoint-002, path: build/seed-transport/checkpoint.part-002, compression-level: 0, retention-days: 90, if-no-files-found: warn}
      - name: Fetch every authenticated original disk part
        run: |
          python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input
          python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input
          python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input
          python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-original-media-manifest, path: build/media-input/*.json, retention-days: 90}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-original-media-aa, path: build/media-input/disk.part-aa, compression-level: 0, retention-days: 90}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-original-media-ab, path: build/media-input/disk.part-ab, compression-level: 0, retention-days: 90}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-original-media-ac, path: build/media-input/disk.part-ac, compression-level: 0, retention-days: 90}
      - name: Restore exactly the original sparse disk
        run: python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw > evidence/migration/media-restored.json
      - name: Compare the rebuilt original decoder against the authenticated source pixels
        run: |
          build/native/frame build/source-state/current.rvg build/media/android-c27.raw "$(python3 -c 'import json;print(json.load(open("state/continuation.json"))["source"]["checkpoint_sha256"])')" 4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e 10888413184 build/seed-frame.ppm > evidence/migration/seed-frame.json
          node tools/reverseandroid-verify-frame.mjs build/source-state/checkpoint-frame.json evidence/migration/seed-frame.json evidence/migration/rebuilt-decoder-verification.json
      - name: Execute and admit the next bounded Android cycle
        run: |
          node --max-old-space-size=5000 tools/reverseandroid-continue.mjs build/source-state evidence/cycle build/native/native build/media/android-c27.raw build/native/frame "$(git rev-parse HEAD)" > evidence/migration/continuation.json
      - name: Preserve the new verified checkpoint in recoverable pieces
        run: python3 scripts/pack-reverseandroid-checkpoint.py evidence/cycle build/current-transport > evidence/migration/current-transport.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-current-checkpoint-000, path: build/current-transport/checkpoint.part-000, compression-level: 0, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-current-checkpoint-001, path: build/current-transport/checkpoint.part-001, compression-level: 0, retention-days: 90, if-no-files-found: warn}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-current-checkpoint-002, path: build/current-transport/checkpoint.part-002, compression-level: 0, retention-days: 90, if-no-files-found: warn}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverseandroid-migration-and-progress
          path: |
            evidence/migration/
            evidence/cycle/*.json
            evidence/cycle/*.txt
            evidence/cycle/*.log
            evidence/cycle/native/*.json
            evidence/cycle/native/*.log
          retention-days: 90
          if-no-files-found: warn
