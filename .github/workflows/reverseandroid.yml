name: reverseAndroid verified migration and continuation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-engine-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24.22.1}
      - name: Verify all 870 source files and the original engine and admission tests
        run: bash scripts/build-reverseandroid.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverseandroid-tested-native
          path: |
            build/reverseandroid/*.json
            build/reverseandroid/*.txt
            build/reverseandroid/*.tap
            build/reverseandroid/native
          if-no-files-found: error
          retention-days: 90
  authenticated-android-continuation:
    needs: original-engine-validation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
      REVERSE_PC_C39_CHUNK: '1000000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24.22.1}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: reverseandroid-tested-native, path: build/native}
      - name: Fetch and authenticate the exact C68 stage 12 and original decoder archives
        run: |
          python3 scripts/fetch-reverseandroid-artifact.py seed build/source-c68
          python3 scripts/fetch-reverseandroid-artifact.py decoder build/original-decoder
          chmod +x build/native/native build/original-decoder/frame
          test "$(sha256sum build/original-decoder/frame | cut -d ' ' -f 1)" = '4eff5aeb8f30c9e8b36aed3dbc6d9b22c6ffab9f33b1d0735f79395133284a19'
          mkdir -p evidence/migration
          node --max-old-space-size=5000 tools/reverseandroid-seed.mjs build/source-c68 evidence/migration/seed-admission.json
      - name: Preserve the source checkpoint in recoverable pieces
        run: python3 scripts/pack-reverseandroid-checkpoint.py build/source-c68 build/seed-transport > evidence/migration/seed-transport.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-c68-seed-000, path: build/seed-transport/checkpoint.part-000, compression-level: 0, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-c68-seed-001, path: build/seed-transport/checkpoint.part-001, compression-level: 0, retention-days: 90, if-no-files-found: warn}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-c68-seed-002, path: build/seed-transport/checkpoint.part-002, compression-level: 0, retention-days: 90, if-no-files-found: warn}
      - name: Fetch every authenticated original disk part
        run: |
          python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input
          python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input
          python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input
          python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-original-media-manifest, path: build/media-input/*.json, retention-days: 90}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-original-media-aa, path: build/media-input/disk.part-aa, compression-level: 0, retention-days: 90}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-original-media-ab, path: build/media-input/disk.part-ab, compression-level: 0, retention-days: 90}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-original-media-ac, path: build/media-input/disk.part-ac, compression-level: 0, retention-days: 90}
      - name: Restore exactly the original sparse disk
        run: python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw > evidence/migration/media-restored.json
      - name: Execute and admit C69 from the original C68 boundary
        run: |
          node --max-old-space-size=5000 tools/reverseandroid-continue.mjs build/source-c68 evidence/c69 build/native/native build/media/android-c27.raw build/original-decoder/frame "$(git rev-parse HEAD)" > evidence/migration/continuation.json
      - name: Preserve the new verified checkpoint in recoverable pieces
        run: python3 scripts/pack-reverseandroid-checkpoint.py evidence/c69 build/c69-transport > evidence/migration/c69-transport.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-c69-checkpoint-000, path: build/c69-transport/checkpoint.part-000, compression-level: 0, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-c69-checkpoint-001, path: build/c69-transport/checkpoint.part-001, compression-level: 0, retention-days: 90, if-no-files-found: warn}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reverseandroid-c69-checkpoint-002, path: build/c69-transport/checkpoint.part-002, compression-level: 0, retention-days: 90, if-no-files-found: warn}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reverseandroid-migration-and-progress
          path: |
            evidence/migration/
            evidence/c69/*.json
            evidence/c69/*.txt
            evidence/c69/*.log
            evidence/c69/native/*.json
            evidence/c69/native/*.log
          retention-days: 90
          if-no-files-found: warn
