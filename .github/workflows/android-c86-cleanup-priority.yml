name: C86 guarded cleanup priority and original Android boot
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-c86-cleanup-priority.yml
    - state/experiments/c86-plan.json
    - state/experiments/c86-artifacts.json
    - scripts/run-c86-stage.py
    - scripts/prepare-c86-resume-state.py
    - scripts/c86_cleanup_eligibility.py
    - scripts/c86_cleanup_priority_input.py
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-c86-cleanup-priority
  cancel-in-progress: false
jobs:
  c86-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Authenticate exact C85 stage3, full original source, complete dying thread list and every old UART event
      run: "python3 scripts/verify-reverseandroid-import.py\npython3 tests/c85_resume_state_test.py\npython3 tests/c86_cleanup_priority_input_test.py\n\
        python3 tests/c86_cleanup_eligibility_test.py\npython3 tests/c85_peripheral_completion_test.py\npython3\
        \ tests/control_console_phase_test.py\npython3 tests/console_command_syntax_test.py\npython3 tests/reverseandroid_workflow_phase_guard_test.py\n\
        node --test tests/reverseandroid_console_proof.test.mjs tests/reverseandroid_epoch_input.test.mjs tests/reverseandroid_campaign_input.test.mjs\n\
        python3 scripts/fetch-reverseandroid-artifact.py native-cache build/reverseandroid state/experiments/c86-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py ic-native build/ic-native state/experiments/c86-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py ic-hardware build/ic-hardware state/experiments/c86-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py campaign-console build/c86-old-console state/experiments/c86-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py seed build/source-c86 state/experiments/c86-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/c86-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/c86-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/c86-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/c86-artifacts.json\n\
        python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw\nchmod +x\
        \ build/ic-native/epoch-clz-ic build/reverseandroid/frame\npython3 - <<'PYVALIDATE'\nimport pathlib,json,hashlib,subprocess,sys\n\
        sys.path.insert(0,'scripts')\nfrom console_command_syntax import validate_nested_console_command\nread=lambda\
        \ p:json.loads(pathlib.Path(p).read_text())\nh=lambda p:hashlib.file_digest(pathlib.Path(p).open('rb'),'sha256').hexdigest()\n\
        p=read('state/experiments/c86-plan.json')\nassert h('build/ic-native/epoch-clz-ic')==p['expected_extended_native_SHA256']\n\
        assert p['IC_IVAU_validation_run']==42221035217\nfor directory,hardware in [('build/ic-native',False),('build/ic-hardware',True)]:\n\
        \ d=pathlib.Path(directory);assert (d/'execution-commit.txt').read_text().strip()==p['validated_IC_IVAU_commit']\n\
        \ t=read(d/'ic-ivau-test.json');assert t['IC_IVAU_cases']==2048 and t['real_AArch64_hardware_cases']==int(hardware)\n\
        \ assert all(t[k] for k in ['all_Rt_and_unaligned_offsets','UCI_traps_exact_SYS_syndrome','neighbor_privileged_SYS_still_rejected','original_snapshot_roundtrip_and_guest_JIT_response'])\n\
        \ c=read(d/'retained-clz-test.json');assert c['CLZ_cases']==30887 and c['real_AArch64_hardware_cases']==(30887\
        \ if hardware else 0)\n assert read(d/'baseline-IC-refusal.json')['actual_exact_IC_IVAU_erroneously_undefined_with_UCI_enabled']\n\
        \ assert read(d/'prior-el0-cache-test.json')['checks']==82 and read(d/'prior-system-test.json')['checks']==1992\n\
        \ m=read(d/'extension-manifest.json');assert m['extension_SHA256']==p['IC_IVAU_extension_SHA256']\n assert\
        \ m['all_870_imported_files_unchanged'] and m['snapshot_codecs_RAM_disk_clock_seed_cadence_IRQ_and_security_gates_unchanged']\n\
        \ assert m['retained_CLZ_extension']['extension_SHA256']==p['extension_SHA256'] and not m['original_engine_binary_unchanged_claimed']\n\
        assert h('extensions/aarch64-el0-ic-ivau.inc')==p['IC_IVAU_extension_SHA256']\nfor phase in p['phases'][4:]:\n\
        \ f=pathlib.Path(phase['input_file']);assert f.stat().st_size==phase['input_bytes']<=4096 and h(f)==phase['input_sha256']\n\
        \ validate_nested_console_command(f.read_bytes())\nfor item in p['source_console_stages']:\n subprocess.run([sys.executable,'scripts/fetch-reverseandroid-artifact.py',item['artifact_alias'],'build/c86-metadata/'+item['artifact_alias'],'state/experiments/c86-artifacts.json'],check=True)\n\
        PYVALIDATE\nmkdir -p evidence/c86-reports\nnode --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs\
        \ preflight build/source-c86 > evidence/c86-reports/source-original-admission.json\npython3 scripts/prepare-c86-resume-state.py\
        \ build/source-c86 build/c86-old-console/evidence/c83-reports/console-all.bin build/c86-metadata evidence/c86-reports\
        \ state/experiments/c86-plan.json docs/evidence/c86/source3-cleanup-threads.json\n"
    - name: 'C86 cleanup stage 1: one bounded original-admitted native run and at most one authenticated buffered
        input'
      id: r1
      if: success()
      run: 'python3 scripts/run-c86-stage.py 1

        '
    - name: 'C86 cleanup stage 1: inspect original executables and actual reciprocal kernel PTY links'
      if: success() && steps.r1.outcome == 'success'
      continue-on-error: true
      run: 'TASK_ABI2_SHA=$(python3 -c ''import json;print(json.load(open("evidence/c86-1/output-contract.json"))["checkpoint_sha256"])'')

        node --max-old-space-size=5000 tools/reverseandroid-peripheral-probe.mjs evidence/c86-1/current.rvg "$TASK_ABI2_SHA"
        evidence/c86-1/peripherals-readonly.json /data/local/tmp/reverseandroid-peer-abi3.elf

        '
    - name: 'C86 cleanup stage 1: preserve every complete original checkpoint piece'
      if: always() && (steps.r1.outcome == 'success' || steps.r1.outcome == 'failure') && hashFiles('evidence/c86-1/c46-progress.json')
        != ''
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/c86-1
        transport_path: build/c86-transport-1
        artifact_prefix: reverseandroid-c86-1
      id: p1
    - name: 'C86 cleanup stage 1: release only earlier host duplicates after complete preservation'
      if: success() && steps.r1.outcome == 'success' && steps.p1.outcome == 'success'
      run: 'rm -rf build/source-c86

        '
    - name: 'C86 cleanup stage 2: one bounded original-admitted native run and at most one authenticated buffered
        input'
      id: r2
      if: success() && steps.r1.outcome == 'success' && steps.r1.outputs.complete != 'true' && steps.p1.outcome
