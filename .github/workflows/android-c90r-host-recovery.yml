name: C90R resume original stage 6 with validated host transport
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/android-c90r-host-recovery.yml
      - scripts/host_transport_continuation.py
      - tests/host_transport_continuation_test.py
      - state/experiments/c90r-plan.json
      - state/experiments/c90r-artifacts.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-c90r-validated-host-continuation
  cancel-in-progress: false
jobs:
  c90r-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify the original import and derive only the validated host tool profile
        run: |
          mkdir -p build evidence/c90r-reports
          cat /proc/meminfo > evidence/c90r-reports/host-meminfo.txt
          df -h > evidence/c90r-reports/host-disk.txt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          python3 scripts/verify-reverseandroid-import.py
          python3 tests/host_transport_continuation_test.py
          python3 tests/c85_peripheral_completion_test.py
          python3 tests/c88_jit_priority_control_test.py
          python3 scripts/prepare-host-transport.py build/host-transport-runtime
      - name: Authenticate the actual validated binaries, full controls and preserved larger-trial evidence
        run: |
          python3 scripts/fetch-reverseandroid-artifact.py native-cache build/reverseandroid state/experiments/c90r-artifacts.json
          python3 scripts/fetch-reverseandroid-artifact.py ic-native build/ic-native state/experiments/c90r-artifacts.json
          python3 scripts/fetch-reverseandroid-artifact.py host-native build/host-native state/experiments/c90r-artifacts.json
          python3 scripts/fetch-reverseandroid-artifact.py host-validation build/host-validation state/experiments/c90r-artifacts.json
          chmod +x build/ic-native/epoch-clz-ic build/reverseandroid/frame build/host-native/epoch-clz-ic-host build/host-native/frame
          python3 scripts/host_transport_continuation.py profile
      - name: Recover original C90 stage 6 and require both original and explicit-host admissions
        run: |
          python3 scripts/fetch-reverseandroid-artifact.py seed build/source-c90r state/experiments/c90r-artifacts.json
          for name in media-manifest media-aa media-ab media-ac; do
            python3 scripts/fetch-reverseandroid-artifact.py "$name" build/media-input state/experiments/c90r-artifacts.json
          done
          python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw
          node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs preflight build/source-c90r > evidence/c90r-reports/source-original-admission.json
          node --expose-gc --max-old-space-size=5000 build/host-transport-runtime/tools/reverseandroid-epoch.mjs preflight build/source-c90r > evidence/c90r-reports/source-host-profile-admission.json
          python3 scripts/host_transport_continuation.py prepare
      - name: 'C90R stage 1: reproduce the validated 300M checkpoint with zero new UART'
        id: r1
        if: success()
        run: python3 scripts/host_transport_continuation.py run --stage 1
      - name: 'C90R stage 1: preserve every admitted checkpoint piece before advancing'
        id: p1
        if: always() && steps.r1.outcome == 'success'
        uses: ./.github/actions/preserve-android-checkpoint
        with:
          checkpoint_path: evidence/c90r-1
          transport_path: build/c90r-transport-1
          artifact_prefix: reverseandroid-c90r-1
      - name: 'C90R stage 1: release only the previously preserved host duplicate'
        if: success() && steps.r1.outcome == 'success' && steps.p1.outcome == 'success'
        run: rm -rf build/source-c90r build/reverseandroid-seed-pieces
      - name: 'C90R stage 2: zero new UART and full original admission'
        id: r2
        if: success() && steps.r1.outcome == 'success' && steps.p1.outcome == 'success' && steps.r1.outputs.complete != 'true'
        run: python3 scripts/host_transport_continuation.py run --stage 2
      - name: 'C90R stage 2: preserve every admitted checkpoint piece before advancing'
        id: p2
        if: always() && steps.r2.outcome == 'success'
        uses: ./.github/actions/preserve-android-checkpoint
        with:
          checkpoint_path: evidence/c90r-2
          transport_path: build/c90r-transport-2
          artifact_prefix: reverseandroid-c90r-2
      - name: 'C90R stage 2: release only the previously preserved host duplicate'
        if: success() && steps.r2.outcome == 'success' && steps.p2.outcome == 'success'
        run: rm -rf evidence/c90r-1 build/c90r-transport-1
      - name: 'C90R stage 3: zero new UART and full original admission'
        id: r3
        if: success() && steps.r2.outcome == 'success' && steps.p2.outcome == 'success' && steps.r2.outputs.complete != 'true'
        run: python3 scripts/host_transport_continuation.py run --stage 3
      - name: 'C90R stage 3: preserve every admitted checkpoint piece before advancing'
        id: p3
        if: always() && steps.r3.outcome == 'success'
        uses: ./.github/actions/preserve-android-checkpoint
        with:
