name: Android C80 continued corrected boot epoch
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-c80-continued-epoch.yml
    - state/experiments/c80-plan.json
    - state/experiments/c80-artifacts.json
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-c80-campaign
  cancel-in-progress: false
jobs:
  c80-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: guadalupejuan001-code/mundo-X
        ref: e2778d962af22f6f1a0794058dd4685fc2573966
        path: deps/mundo-x
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Authenticate the unchanged sources and the fully tested original C78 epoch runner
      run: 'python3 scripts/verify-reverseandroid-import.py

        python3 scripts/fetch-reverseandroid-artifact.py native-cache build/reverseandroid state/experiments/c80-artifacts.json

        chmod +x build/reverseandroid/epoch build/reverseandroid/frame

        python3 - <<''PYCACHE''

        import pathlib,json,hashlib

        p=pathlib.Path(''build/reverseandroid'')

        assert hashlib.file_digest((p/''epoch'').open(''rb''),''sha256'').hexdigest()==''72f53074817c140d79b0f91b20c72900efb5072f6c0b08d00ca58bf6c50ca1fa''

        t=json.loads((p/''console-event-test.json'').read_text());assert len(t)==5 and all(x is True for x in t.values())

        PYCACHE

        node --test tests/reverseandroid_epoch_input.test.mjs > build/reverseandroid/c80-epoch-input-tests.tap

        mkdir -p evidence/c80-reports

        '
    - name: Recover the latest pinned complete C79 boundary without resetting the guest
      run: 'python3 scripts/fetch-reverseandroid-artifact.py seed build/source state/experiments/c80-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/c80-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/c80-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/c80-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/c80-artifacts.json

        python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw > evidence/c80-reports/disk.json

        node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs preflight build/source > evidence/c80-reports/source-admission.json

        '
    - name: 'C80 stage 1: continue and fully admit the same boot epoch'
      id: s1
      if: success()
      run: 'node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs run build/source evidence/c80-1
        build/reverseandroid/epoch build/media/android-c27.raw build/reverseandroid/frame "$(git rev-parse HEAD)"
        2000000000 > evidence/c80-reports/stage-1.json

        cp evidence/c80-1/kernel-observation.json evidence/c80-reports/kernel-1.json

        cp evidence/c80-1/console-new.txt evidence/c80-reports/console-1.txt

        python3 - <<''PYVERIFY''

        import pathlib,json,hashlib,shutil

        p=pathlib.Path(''evidence/c80-1'');g=json.load(open(p/''c46-progress.json''));assert g[''source_boundary_verified''];assert
        hashlib.file_digest(open(p/''current.rvg'',''rb''),''sha256'').hexdigest()==g[''checkpoint_sha256''];shutil.rmtree(p/''native/journal'')

        PYVERIFY

        '
    - name: 'C80 stage 1: inspect original Java threads without changing the guest'
      if: success() && steps.s1.outcome == 'success'
      continue-on-error: true
      run: 'TASK_THREAD_SHA=$(python3 -c ''import json;print(json.load(open("evidence/c80-1/output-contract.json"))["checkpoint_sha256"])'')

        node --max-old-space-size=5000 tools/reverseandroid-thread-probe.mjs evidence/c80-1/current.rvg "$TASK_THREAD_SHA"
        evidence/c80-1/threads-readonly.json

        cp evidence/c80-1/threads-readonly.json evidence/c80-reports/threads-1.json

        '
    - name: 'C80 stage 1: preserve every complete original checkpoint piece'
      if: success() && steps.s1.outcome == 'success'
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/c80-1
        transport_path: build/c80-transport-1
        artifact_prefix: reverseandroid-c80-stage-1
    - name: Verify the exact source pin and compare the first complete snapshot when independently known
      if: success() && steps.s1.outcome == 'success'
      run: "python3 - <<'PYCOMPARE'\nimport json\nplan=json.load(open('state/experiments/c80-plan.json'))\nsource=json.load(open('evidence/c80-1/input-contract.json'))\n\
        actual=json.load(open('evidence/c80-1/c46-progress.json'))\nassert source['checkpoint_sha256']==plan['source_checkpoint_sha256']\n\
        assert source['instructions']==plan['source_instructions']\nassert actual['source_boundary_verified']\n\
        if 'expected_first_full_checkpoint_sha256' in plan:\n    assert actual['instructions']==plan['expected_first_instructions']\n\
        \    assert actual['checkpoint_sha256']==plan['expected_first_full_checkpoint_sha256']\nPYCOMPARE\n"
    - name: Release recovered input host copy after the first complete continued state was preserved
      if: success() && steps.s1.outcome == 'success'
      run: 'rm -rf build/source

        '
    - name: 'C80 stage 2: continue and fully admit the same boot epoch'
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.ready != 'true'
      run: 'node --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs run evidence/c80-1 evidence/c80-2
        build/reverseandroid/epoch build/media/android-c27.raw build/reverseandroid/frame "$(git rev-parse HEAD)"
        2000000000 > evidence/c80-reports/stage-2.json

        cp evidence/c80-2/kernel-observation.json evidence/c80-reports/kernel-2.json

        cp evidence/c80-2/console-new.txt evidence/c80-reports/console-2.txt

        python3 - <<''PYVERIFY''

        import pathlib,json,hashlib,shutil

        p=pathlib.Path(''evidence/c80-2'');g=json.load(open(p/''c46-progress.json''));assert g[''source_boundary_verified''];assert
        hashlib.file_digest(open(p/''current.rvg'',''rb''),''sha256'').hexdigest()==g[''checkpoint_sha256''];shutil.rmtree(p/''native/journal'')

        PYVERIFY

        '
    - name: 'C80 stage 2: inspect original Java threads without changing the guest'
      if: success() && steps.s2.outcome == 'success'
      continue-on-error: true
      run: 'TASK_THREAD_SHA=$(python3 -c ''import json;print(json.load(open("evidence/c80-2/output-contract.json"))["checkpoint_sha256"])'')

        node --max-old-space-size=5000 tools/reverseandroid-thread-probe.mjs evidence/c80-2/current.rvg "$TASK_THREAD_SHA"
        evidence/c80-2/threads-readonly.json

        cp evidence/c80-2/threads-readonly.json evidence/c80-reports/threads-2.json

        '
    - name: 'C80 stage 2: inspect real lights service without modifying guest state'
      if: success() && steps.s2.outcome == 'success'
      continue-on-error: true
      run: 'TASK_SOURCE_SHA=$(python3 -c ''import json;print(json.load(open("evidence/c80-2/output-contract.json"))["checkpoint_sha256"])'')

        node --max-old-space-size=5000 tools/reverseandroid-lights-probe.mjs evidence/c80-2/current.rvg "$TASK_SOURCE_SHA"
        evidence/c80-2/lights-readonly.json

