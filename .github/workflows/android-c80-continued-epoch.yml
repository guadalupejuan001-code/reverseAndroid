    - name: Require original Android boot conditions and a frame for visual review
      run: 'node --input-type=module <<''NODE''

        import assert from ''node:assert/strict'';import {existsSync,readFileSync} from ''node:fs'';

        const available=Array.from({length:20},(_,i)=>`evidence/c80-${i+1}`).filter(p=>existsSync(p+''/c46-progress.json''));assert.ok(available.length);

        const last=available.at(-1),gate=JSON.parse(readFileSync(last+''/c46-progress.json'')),result=JSON.parse(readFileSync(last+''/result.json''));

        assert.equal(result.epoch_original_init_verified,true);assert.equal(gate.android_boot_completed_verified,true,''Actual
        Android boot remains pending; preserve this admitted boundary and continue debugging'');assert.equal(gate.ready_for_visual_review,true);

        NODE

        '
