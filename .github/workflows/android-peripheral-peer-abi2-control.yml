name: Actual corrected ARM64 peripheral peer with buffered authenticated UART input
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-peripheral-peer-abi2-control.yml
    - state/experiments/peripheral-peer-abi2-control-plan.json
    - state/experiments/peripheral-peer-abi2-control-artifacts.json
    - state/experiments/peripheral-peer-abi2-control-input-*.txt
    - scripts/run-peripheral-peer-abi2-stage.py
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-abi2-buffered-peer-control
  cancel-in-progress: false
jobs:
  peripheral-peer-abi2-control:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Authenticate corrected ARM64 ABI build, newest source and immutable media
      run: "python3 scripts/verify-reverseandroid-import.py\npython3 scripts/fetch-reverseandroid-artifact.py native-cache\
        \ build/reverseandroid state/experiments/peripheral-peer-abi2-control-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ seed build/source-abi2 state/experiments/peripheral-peer-abi2-control-artifacts.json\npython3 scripts/fetch-reverseandroid-artifact.py\
        \ peripheral-peer build/peripheral-peer-abi2 state/experiments/peripheral-peer-abi2-control-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/peripheral-peer-abi2-control-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/peripheral-peer-abi2-control-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/peripheral-peer-abi2-control-artifacts.json\n\
        python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/peripheral-peer-abi2-control-artifacts.json\n\
        python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw\nchmod +x\
        \ build/reverseandroid/epoch build/reverseandroid/frame\nmkdir -p evidence/peripheral-peer-abi2-control-reports\n\
        python3 - <<'PYAUDIT'\nimport pathlib,json,hashlib,gzip\np=pathlib.Path('build/reverseandroid');h=lambda\
        \ f:hashlib.file_digest(f.open('rb'),'sha256').hexdigest()\nassert h(p/'epoch')=='72f53074817c140d79b0f91b20c72900efb5072f6c0b08d00ca58bf6c50ca1fa'\n\
        f=json.loads((p/'console-event-test.json').read_text());assert len(f)==5 and all(v is True for v in f.values())\n\
        p=pathlib.Path('build/peripheral-peer-abi2');m=json.loads((p/'build-manifest.json').read_text());e=json.loads(pathlib.Path('state/experiments/peripheral-peer-abi2-control-plan.json').read_text())\n\
        assert (p/'execution-commit.txt').read_text().strip()=='0d58e916564cdfb9dff416f1a9e5bbac13711738'\nassert\
        \ h(p/'cuttlefish-peripheral-peer-aarch64')==m['ELF_SHA256']==e['ELF_SHA256']\nassert h(p/'peer-aarch64.gz')==m['gzip_SHA256']==e['gzip_SHA256']\n\
        assert gzip.decompress((p/'peer-aarch64.gz').read_bytes())==(p/'cuttlefish-peripheral-peer-aarch64').read_bytes()\n\
        abi=json.loads((p/'arm64-abi-test.json').read_text());assert abi=={'official_AArch64_UAPI_flags_match':True,'O_DIRECTORY':16384,'O_NOFOLLOW':32768}\n\
        assert all(json.loads((p/'protocol-test.json').read_text()).values())\nt=json.loads((p/'pty-test.json').read_text());assert\
        \ not t.pop('host_device_provisioning_attempted') and not t.pop('Android_HAL_integration_claimed');assert\
        \ all(t.values())\nfor phase in e['phases']:\n f=pathlib.Path(phase['input_file']);assert f.stat().st_size==phase['input_bytes']<=4096\
        \ and h(f)==phase['input_sha256']\nPYAUDIT\nnode --expose-gc --max-old-space-size=5000 tools/reverseandroid-epoch.mjs\
        \ preflight build/source-abi2 > evidence/peripheral-peer-abi2-control-reports/source-admission.json\n"
    - name: 'ABI2 stage 1: one bounded original run and at most one authenticated buffered input'
      id: r1
      if: success()
      run: 'python3 scripts/run-peripheral-peer-abi2-stage.py 1

        '
    - name: 'ABI2 stage 1: inspect original executables and actual reciprocal kernel PTY links'
      if: success() && steps.r1.outcome == 'success'
      continue-on-error: true
      run: 'TASK_ABI2_SHA=$(python3 -c ''import json;print(json.load(open("evidence/peripheral-peer-abi2-control-1/output-contract.json"))["checkpoint_sha256"])'')

        node --max-old-space-size=5000 tools/reverseandroid-peripheral-probe.mjs evidence/peripheral-peer-abi2-control-1/current.rvg
        "$TASK_ABI2_SHA" evidence/peripheral-peer-abi2-control-1/peripherals-readonly.json /data/local/tmp/reverseandroid-peer-abi2.elf

        '
    - name: 'ABI2 stage 1: preserve every complete original checkpoint piece'
      if: always() && (steps.r1.outcome == 'success' || steps.r1.outcome == 'failure')
      uses: ./.github/actions/preserve-android-checkpoint
      with:
        checkpoint_path: evidence/peripheral-peer-abi2-control-1
        transport_path: build/peripheral-peer-abi2-control-transport-1
        artifact_prefix: reverseandroid-peripheral-peer-abi2-control-1
    - name: 'ABI2 stage 1: release only earlier host duplicates after complete preservation'
      if: success() && steps.r1.outcome == 'success'
      run: 'rm -rf build/source-abi2

        '
    - name: 'ABI2 stage 2: one bounded original run and at most one authenticated buffered input'
      id: r2
      if: success() && steps.r1.outcome == 'success' && steps.r1.outputs.complete != 'true'
      run: 'python3 scripts/run-peripheral-peer-abi2-stage.py 2

        '
    - name: 'ABI2 stage 2: inspect original executables and actual reciprocal kernel PTY links'
      if: success() && steps.r2.outcome == 'success'
      continue-on-error: true
      run: 'TASK_ABI2_SHA=$(python3 -c ''import json;print(json.load(open("evidence/peripheral-peer-abi2-control-2/output-contract.json"))["checkpoint_sha256"])'')

        node --max-old-space-size=5000 tools/reverseandroid-peripheral-probe.mjs evidence/peripheral-peer-abi2-control-2/current.rvg
        "$TASK_ABI2_SHA" evidence/peripheral-peer-abi2-control-2/peripherals-readonly.json /data/local/tmp/reverseandroid-peer-abi2.elf

        '
    - name: 'ABI2 stage 2: preserve every complete original checkpoint piece'
      if: always() && (steps.r2.outcome == 'success' || steps.r2.outcome == 'failure')
      uses: ./.github/actions/preserve-android-checkpoint
