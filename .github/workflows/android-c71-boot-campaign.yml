name: Android C71 recorded UART control reproduction
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: reverseandroid-c71-campaign
  cancel-in-progress: false
jobs:
  c71-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      REVERSE_PC_FAST_FNV: '1'
      REVERSE_PC_FAST_OBSERVER: '1'
      REVERSE_PC_C39_CHUNK: '1000000'
      REVERSE_PC_C39_CHECKPOINT_MS: '120000'
      REVERSE_PC_C39_CHECKPOINT_INSTRUCTIONS: '200000000'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Authenticate the unchanged original model and supplemental diagnostics
      run: 'python3 scripts/verify-reverseandroid-import.py

        node --test tests/reverseandroid_thread_probe.test.mjs tests/reverseandroid_elf_symbols.test.mjs

        '
    - name: Fetch the pinned tested native binary and the frozen C69 experiment state
      run: 'python3 scripts/fetch-reverseandroid-artifact.py native-cache build/native state/experiments/c71-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py seed build/source state/experiments/c71-artifacts.json

        chmod +x build/native/native build/native/frame

        mkdir -p evidence/c71-reports

        '
    - name: Recover and authenticate the exact original disk
      run: 'python3 scripts/fetch-reverseandroid-artifact.py media-manifest build/media-input state/experiments/c71-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-aa build/media-input state/experiments/c71-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ab build/media-input state/experiments/c71-artifacts.json

        python3 scripts/fetch-reverseandroid-artifact.py media-ac build/media-input state/experiments/c71-artifacts.json

        python3 scripts/restore-reverseandroid-media.py build/media-input build/media/android-c27.raw > evidence/c71-reports/disk.json

        '
    - name: Verify the original rebuilt decoder against the authenticated source pixels
      run: 'build/native/frame build/source/current.rvg build/media/android-c27.raw 119be5c1aa583e7b6819f68157d94a0a6be0a44e6159d8e47005800e563ef6f4
        4c2eaf3fa7d81e9649072fc81f0651f4129bd9f41d4a9f9964cc627741a7b92e 10888413184 build/seed.ppm > evidence/c71-reports/seed-frame.json

        node tools/reverseandroid-verify-frame.mjs build/source/checkpoint-frame.json evidence/c71-reports/seed-frame.json
        evidence/c71-reports/seed-frame-verified.json

        '
    - name: 'C71 stage 1: execute and fully admit the original Android state'
      id: s1
      if: success()
      run: 'node --max-old-space-size=5000 tools/reverseandroid-campaign-stage.mjs 1 build/source evidence/c71-1
        build/native/native build/media/android-c27.raw build/native/frame "$(git rev-parse HEAD)" > evidence/c71-reports/stage-1.json

        '
      env:
        REVERSE_PC_UART_INPUT_FILE: tools/inputs/c71-priority.bin
    - name: 'C71 stage 1: preserve its complete checkpoint in bounded pieces'
      if: success() && steps.s1.outcome == 'success'
      run: 'python3 scripts/pack-reverseandroid-checkpoint.py evidence/c71-1 build/c71-transport-1 > evidence/c71-reports/transport-1.json

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: success() && steps.s1.outcome == 'success'
      with:
        name: reverseandroid-c71-stage-1-000
        path: build/c71-transport-1/checkpoint.part-000
        compression-level: 0
        retention-days: 90
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: success() && steps.s1.outcome == 'success'
      with:
        name: reverseandroid-c71-stage-1-001
        path: build/c71-transport-1/checkpoint.part-001
        compression-level: 0
        retention-days: 90
        if-no-files-found: warn
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: success() && steps.s1.outcome == 'success'
      with:
        name: reverseandroid-c71-stage-1-002
        path: build/c71-transport-1/checkpoint.part-002
        compression-level: 0
        retention-days: 90
        if-no-files-found: warn
    - name: 'C71 stage 1: inspect real runtime threads without changing the guest'
      if: success() && steps.s1.outcome == 'success'
      continue-on-error: true
      run: 'SHA=$(python3 -c ''import json;print(json.load(open("evidence/c71-1/output-contract.json"))["checkpoint_sha256"])'')

        node --max-old-space-size=5000 tools/reverseandroid-thread-probe.mjs evidence/c71-1/current.rvg "$SHA" evidence/c71-1/threads-readonly.json

        cp evidence/c71-1/threads-readonly.json evidence/c71-reports/threads-1.json

        '
    - name: 'C71 stage 2: execute and fully admit the original Android state'
      id: s2
      if: success() && steps.s1.outcome == 'success' && steps.s1.outputs.ready != 'true'
      run: 'node --max-old-space-size=5000 tools/reverseandroid-campaign-stage.mjs 2 evidence/c71-1 evidence/c71-2
        build/native/native build/media/android-c27.raw build/native/frame "$(git rev-parse HEAD)" > evidence/c71-reports/stage-2.json

        '
    - name: 'C71 stage 2: preserve its complete checkpoint in bounded pieces'
