  - id: metadata
    name: Preserve the manifest and original admission evidence
    uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
    with:
      name: ${{ inputs.artifact_prefix }}-metadata
      path: |-
        ${{ inputs.transport_path }}/manifest.json
        ${{ inputs.checkpoint_path }}/*.json
        ${{ inputs.checkpoint_path }}/*.txt
        ${{ inputs.checkpoint_path }}/*.log
        ${{ inputs.checkpoint_path }}/*.ppm
        ${{ inputs.checkpoint_path }}/native/*.json
        ${{ inputs.checkpoint_path }}/native/*.log
      retention-days: 90
      if-no-files-found: error
