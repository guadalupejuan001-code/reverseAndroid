name: Preserve a complete admitted Android checkpoint
description: Keep all bounded checkpoint pieces and their original admission evidence before the next cycle.
inputs:
  checkpoint_path:
    required: true
    description: Fully admitted original checkpoint directory
  transport_path:
    required: true
    description: New directory for bounded transport pieces
  artifact_prefix:
    required: true
    description: Unique artifact prefix for this checkpoint
outputs:
  part_count:
    description: Number of complete checkpoint transport pieces
    value: ${{ steps.pack.outputs.part_count }}
  metadata_artifact_id:
    description: Artifact containing the manifest and original admission evidence
    value: ${{ steps.metadata.outputs.artifact-id }}
runs:
  using: composite
  steps:
  - id: pack
    name: Pack and authenticate every complete checkpoint piece
    shell: bash
    env:
      TASK_CHECKPOINT_SOURCE: ${{ inputs.checkpoint_path }}
      TASK_TRANSPORT_DEST: ${{ inputs.transport_path }}
    run: |
      python3 scripts/pack-reverseandroid-checkpoint.py "$TASK_CHECKPOINT_SOURCE" "$TASK_TRANSPORT_DEST" > "$TASK_TRANSPORT_DEST.log"
      python3 - <<'PYCOUNT'
      import json,os,pathlib
      manifest=json.load(open(pathlib.Path(os.environ['TASK_TRANSPORT_DEST'])/'manifest.json'))
      count=len(manifest['parts'])
      assert 1<=count<=16,'Checkpoint needs more than the supported bounded transport pieces'
      with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write(f'part_count={count}\n')
      PYCOUNT
  - name: Preserve complete checkpoint piece 000
    if: ${{ success() && fromJSON(steps.pack.outputs.part_count) > 0 }}
    uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
    with:
      name: ${{ inputs.artifact_prefix }}-000
      path: ${{ inputs.transport_path }}/checkpoint.part-000
      compression-level: 0
      retention-days: 90
      if-no-files-found: error
  - name: Preserve complete checkpoint piece 001
    if: ${{ success() && fromJSON(steps.pack.outputs.part_count) > 1 }}
    uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
    with:
      name: ${{ inputs.artifact_prefix }}-001
      path: ${{ inputs.transport_path }}/checkpoint.part-001
      compression-level: 0
      retention-days: 90
      if-no-files-found: error
  - name: Preserve complete checkpoint piece 002
    if: ${{ success() && fromJSON(steps.pack.outputs.part_count) > 2 }}
    uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
    with:
      name: ${{ inputs.artifact_prefix }}-002
      path: ${{ inputs.transport_path }}/checkpoint.part-002
      compression-level: 0
      retention-days: 90
      if-no-files-found: error
  - name: Preserve complete checkpoint piece 003
    if: ${{ success() && fromJSON(steps.pack.outputs.part_count) > 3 }}
    uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
    with:
      name: ${{ inputs.artifact_prefix }}-003
      path: ${{ inputs.transport_path }}/checkpoint.part-003
      compression-level: 0
